<style>
  body { margin:0; height:100vh; display:flex; justify-content:center; align-items:center; background:#0c0e13; font-family:Arial, sans-serif; }
  .hp { box-sizing:border-box; height:92vh; aspect-ratio:390/844; border:.8vh solid #222; border-radius:6vh; overflow:hidden; position:relative; background:#000; color:#fff; display:flex; flex-direction:column; }
  .pulau { position:absolute; top:1.4vh; left:50%; transform:translateX(-50%); width:30%; height:4vh; background:#000; border-radius:3vh; z-index:2; }
  .atas { position:relative; box-sizing:border-box; height:17vh; padding-top:6.5vh; background:#1c1c1e; text-align:center; }
  .back { position:absolute; left:2vh; top:8.5vh; font-size:4vh; color:#0a84ff; line-height:1; }
  .ikon { position:absolute; right:2.2vh; top:9.2vh; display:flex; align-items:center; gap:2.6vh; }
  .ikon svg { height:2.8vh; width:auto; display:block; }
  .ava { width:6.5vh; height:6.5vh; border-radius:50%; margin:0 auto; background:#6b7c85 center/cover; display:grid; place-items:center; font-size:3vh; font-weight:600; }
  .nama { font-size:1.7vh; margin-top:.6vh; }
  .chat { flex:1; padding:1.5vh 2vh; overflow:hidden; }
  .bubble { width:fit-content; max-width:70%; padding:1.2vh 1.8vh; border-radius:2.6vh; margin:.8vh 0; font-size:2.1vh; }
  .masuk { background:#262629; }
  .keluar { background:#0a84ff; margin-left:auto; }
  .input { display:flex; align-items:center; gap:1vh; padding:1vh 1.4vh 3vh; }
  .plus { width:4.2vh; height:4.2vh; border-radius:50%; background:#2c2c2e; display:grid; place-items:center; font-size:3vh; color:#aaa; }
  .kolom { flex:1; border:1px solid #3a3a3c; border-radius:3vh; padding:1vh 2vh; font-size:2vh; color:#6e6e73; }
</style>
