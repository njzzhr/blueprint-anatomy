<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Phone</title>
<style>
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;background:#0b0b0f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.hp{position:relative;height:92vh;aspect-ratio:390/844;font-size:1.7vh;border:.8vh solid #222;border-radius:6vh;overflow:hidden;color:#fff;background:#000}
.pulau{position:absolute;top:1.4vh;left:50%;transform:translateX(-50%);width:13vh;height:4vh;background:#000;border-radius:3vh;z-index:12}
.status{position:absolute;top:1.4vh;left:0;right:0;height:4vh;display:flex;justify-content:space-between;align-items:center;padding:0 2.4em;font-weight:600;z-index:11}
.status .r{display:flex;align-items:center;gap:.4em}
.status svg{fill:#fff;height:.8em;width:auto}
.bt{width:1.9em;height:.95em;border:1px solid rgba(255,255,255,.55);border-radius:.3em;position:relative}
.bt::before{content:"";position:absolute;left:1px;top:1px;bottom:1px;width:75%;background:#fff;border-radius:.15em}

.page{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:5.8vh;background:#000}
.nav{display:flex;justify-content:space-between;align-items:center;padding:.7em 1.1em;color:#0a84ff;font-size:1em}
.nav .edit{cursor:pointer;width:3em}
.nav .sp{width:3em}
.seg{display:flex;background:#1c1c1e;border-radius:.6em;padding:.15em;font-size:.82em;text-align:center}
.seg div{padding:.35em 1.3em;border-radius:.5em;color:#fff;cursor:pointer}
.seg .on{background:#636366;font-weight:600}
.scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding:0 1.1em}
.scroll::-webkit-scrollbar{display:none}
.big{font-size:2em;font-weight:700;padding:.1em 0 .5em}
.row{display:flex;align-items:center;padding:.6em 0;position:relative}
.row + .row::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:#1f1f21}
.n{flex:1;min-width:0}
.n b{display:block;font-size:1.05em;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n b.hilang{color:#ff453a}
.n small{display:block;color:#8e8e93;font-size:.8em;margin-top:.15em}
.w{color:#8e8e93;font-size:.85em;margin-right:.8em}
svg.i{width:1.4em;height:1.4em;fill:none;stroke:#0a84ff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.kosong{text-align:center;color:#8e8e93;padding:6em 0;font-size:1.1em}
.tabbar{display:flex;justify-content:space-around;padding:.7em 0 2.4em;background:rgba(28,28,30,.9);border-top:1px solid #2c2c2e}
.tabbar div{text-align:center;font-size:.68em;color:#8e8e93}
.tabbar .on{color:#0a84ff}
.tabbar svg{display:block;margin:0 auto .3em;width:2.4em;height:2.4em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.home{position:absolute;bottom:0;left:0;right:0;height:2.2em;display:flex;justify-content:center;align-items:flex-end;padding-bottom:.6em;cursor:pointer;z-index:13}
.home i{width:10em;height:.35em;border-radius:1em;background:#fff;display:block}
/* ===== LAYAR PANGGILAN ===== */
.call{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;padding-top:6.2em;background:linear-gradient(#3a3a3f,#16161a);overflow:hidden}
.cbg{position:absolute;inset:-2em;background:center/cover;filter:blur(1.4em) brightness(.4);z-index:-1}
.cnama{font-size:1.9em;font-weight:500;text-align:center;padding:0 1em}
.cstat{color:rgba(255,255,255,.7);font-size:1.05em;margin-top:.3em}
.cchat{flex:1;min-height:0;width:100%;overflow-y:auto;padding:1em 1.1em;display:flex;flex-direction:column;gap:.5em;scrollbar-width:none}
.cchat::-webkit-scrollbar{display:none}
.b{max-width:78%;padding:.55em .9em;border-radius:1.2em;font-size:.95em;line-height:1.35;animation:muncul .25s}
.b.dia{align-self:flex-start;background:rgba(255,255,255,.22)}
.b.aku{align-self:flex-end;background:#0a84ff}
.b.info{align-self:center;background:none;color:rgba(255,255,255,.6);font-size:.8em;text-align:center;max-width:90%}
@keyframes muncul{from{opacity:0;transform:translateY(.6em)}to{opacity:1;transform:none}}
.cgrid{display:grid;grid-template-columns:repeat(3,3.9em);gap:.9em 2.2em;margin:.6em 0 .9em;justify-content:center}
.cb{text-align:center;font-size:.7em;cursor:pointer;user-select:none}
.ci{width:5.5em;height:5.5em;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;margin:0 auto .45em}
.ci svg{width:2.4em;height:2.4em;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cb.on .ci{background:#fff}
.cb.on .ci svg{stroke:#000}
.cend{width:4.2em;height:4.2em;border-radius:50%;background:#ff3b30;display:grid;place-items:center;margin-bottom:3.6em;cursor:pointer}
.cend svg{width:2em;height:2em;fill:#fff;transform:rotate(135deg)}
.cbar{position:absolute;bottom:.6em;left:50%;transform:translateX(-50%);width:10em;height:.35em;border-radius:1em;background:#fff}
</style>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="stylesheet" href="mobile.css"></head>
<body>

      <div><svg viewBox="0 0 24 24"><circle cx="7" cy="12" r="3.5"/><circle cx="17" cy="12" r="3.5"/><path d="M7 15.5h10"/></svg>Voicemail</div>

  <div class="home" onclick="location.href='home.html'"><i></i></div>

  <!-- Layar panggilan -->
  <div class="call" id="call">
    <div class="cbg" id="cbg"></div>

    <div class="cgrid">
      <div class="cb"><div class="ci"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M4 4l16 16"/></svg></div>mute</div>
      <div class="cb"><div class="ci"><svg viewBox="0 0 24 24"><circle cx="6" cy="5" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="18" cy="5" r="1"/><circle cx="6" cy="11" r="1"/><circle cx="12" cy="11" r="1"/><circle cx="18" cy="11" r="1"/><circle cx="6" cy="17" r="1"/><circle cx="12" cy="17" r="1"/><circle cx="18" cy="17" r="1"/></svg></div>keypad</div>
      <div class="cb"><div class="ci"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg></div>speaker</div>
      <div class="cb"><div class="ci"><svg viewBox="0 0 24 24"><circle cx="10" cy="8" r="4"/><path d="M3 20c.8-3.6 3.4-5.5 7-5.5M18 12v7M14.5 15.5h7"/></svg></div>add call</div>
      <div class="cb"><div class="ci"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="3"/><path d="M15 10l6-3v10l-6-3z"/></svg></div>FaceTime</div>
      <div class="cb"><div class="ci"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.5 18c1.2-2.2 3-3 5.5-3s4.3.8 5.5 3"/></svg></div>contacts</div>
    </div>
    <div class="cend" id="cend"><svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg></div>
    <div class="cbar"></div>

<script>
// ====== GANTI / TAMBAH RIWAYAT TELEPON DI SINI ======
// nama   = nama kontak atau nomor
// jml    = berapa kali nelpon (kosongin kalau 1)
// sub    = keterangan di bawah nama (mobile, Indonesia, dll.)
// hilang = true kalau tidak terjawab (nama jadi merah)
// waktu  = jam atau hari di sebelah kanan
const panggilan = [
  { nama: 'Hyuck 💕', jml: 2, sub: 'mobile', hilang: true,  waktu: '20:48' },
  { nama: 'Mami',               sub: 'mobile',                waktu: '19:30' },
  { nama: '+62 821-5550-1234', jml: 3, sub: 'Indonesia', hilang: true, waktu: '17:45' },
  { nama: 'Hyuck 💕',           sub: 'mobile',                waktu: 'Yesterday' },
  { nama: 'Mami',    jml: 2, sub: 'mobile', hilang: true,  waktu: 'Yesterday' },
  { nama: 'Kak Karin',          sub: 'mobile',                waktu: 'Thursday' },
  { nama: 'dr. Aryo',           sub: 'mobile',                waktu: 'Wednesday' },
  { nama: '+62 012-0000-0071', sub: 'Indonesia', hilang: true, waktu: '21/10/2026' },
  { nama: 'Hyuck 💕', jml: 4, sub: 'mobile',                waktu: '20/10/2026' }
];

// ====== KODE ======
const isi = document.getElementById('isi');
const semua = document.getElementById('semua');
const tak = document.getElementById('tak');
let tampil = 'semua';

const info = '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.6v.2"/></svg>';

function render() {
  isi.innerHTML = '';
  const daftar = panggilan.filter(p => tampil === 'semua' || p.hilang);
  if (!daftar.length) {
    const k = document.createElement('div'); k.className = 'kosong'; k.textContent = 'No Recents';
    isi.appendChild(k); return;
  }
  daftar.forEach(p => {
    const r = document.createElement('div');
    r.className = 'row';
    r.style.cursor = 'pointer';
    r.onclick = () => mulai(p.nama);
    r.innerHTML = '<div class="n"><b></b><small></small></div><span class="w"></span>' + info;
    const b = r.querySelector('b');
    b.textContent = p.nama + (p.jml ? ' (' + p.jml + ')' : '');
    if (p.hilang) b.classList.add('hilang');
    r.querySelector('small').textContent = p.sub;
    r.querySelector('.w').textContent = p.waktu;
    isi.appendChild(r);
  });
}
semua.onclick = () => { tampil = 'semua'; semua.className = 'on'; tak.className = ''; render(); };
tak.onclick = () => { tampil = 'tak'; tak.className = 'on'; semua.className = ''; render(); };
render();

// ====== OBROLAN TELEPON (GANTI / TAMBAH DI SINI) ======
// Kuncinya harus sama persis dengan 'nama' di daftar panggilan di atas.
// dari: 'dia'  = lawan bicara (kiri)
//       'aku'  = Jeno, pemilik HP (kanan, biru)
//       'info' = keterangan kecil di tengah
const percakapan = {
  'Hyuck 💕': [
    { dari: 'dia', teks: 'halo sayang, akhirnya diangkat 😭' },
    { dari: 'aku', teks: 'iya maaf, tadi lagi praktikum, hp di tas' },
    { dari: 'dia', teks: 'aku kira kamu marah soal yang di perpus' },
    { dari: 'aku', teks: 'marah sih... dikit. tiga jam lho aku nunggu' },
    { dari: 'dia', teks: 'maaf maaf, tadi dosen ngajak survei dadakan, hpku juga lowbat' },
    { dari: 'aku', teks: 'ya udah. kamu udah makan belum?' },
    { dari: 'dia', teks: 'belum... baru minum kopi doang hehe' },
    { dari: 'aku', teks: 'Hyuck. kan udah aku bilang' },
    { dari: 'dia', teks: 'iya iya, nanti aku beli nasi. kamu di mana sekarang?' },
    { dari: 'aku', teks: 'lagi di jalan pulang' },
    { dari: 'dia', teks: 'aku jemput ya? aku bawain es krim stroberi 🍦' },
    { dari: 'aku', teks: '...ya udah deh. jangan ngebut' },
    { dari: 'dia', teks: 'siap, dokter 💕' }
  ],
  'Mami': [
    { dari: 'dia', teks: 'Nak, udah makan?' },
    { dari: 'aku', teks: 'udah, Mi. baru pulang praktikum' },
    { dari: 'dia', teks: 'Kamu jangan kebanyakan begadang, nanti sakit. Mami denger dari Karin kamu jarang tidur' },
    { dari: 'aku', teks: 'iya Mi, aku jaga kok. udah minum vitamin' },
    { dari: 'dia', teks: 'Minggu depan pulang ya? Mami masakin rendang' },
    { dari: 'aku', teks: 'aku lihat jadwal dulu ya Mi, ada kuis hari Kamis' },
    { dari: 'dia', teks: 'Ajak temen kamu yang suka es krim itu, Mami pengen kenalan' },
    { dari: 'aku', teks: '...Mi!' },
    { dari: 'dia', teks: 'Mami cuma bilang. Ya sudah, istirahat ya Nak' },
    { dari: 'aku', teks: 'iya Mi, Mami juga. sayang Mami' }
  ],
  '+62 821-5550-1234': [
    { dari: 'dia', teks: 'Selamat siang Bapak/Ibu, kami dari layanan pelanggan. Anda terpilih sebagai pemenang undian berhadiah 50 juta rupiah!' },
    { dari: 'aku', teks: 'undian apa ya? saya nggak pernah ikut undian' },
    { dari: 'dia', teks: 'Ini undian otomatis dari nomor ponsel Anda. Untuk mencairkan hadiah, mohon sebutkan kode OTP yang baru kami kirim' },
    { dari: 'aku', teks: 'nggak mau. ini penipuan kan?' },
    { dari: 'dia', teks: 'Bapak/Ibu, ini prosedur resmi, mohon jangan ditutup' },
    { dari: 'aku', teks: 'saya bukan anak kemarin sore. saya blokir ya' },

  ],
  '+62 812-9988-0071': [
    { dari: 'dia', teks: 'Halo, selamat sore. Saya dari pihak bank, kartu Anda terindikasi akan diblokir' },
    { dari: 'aku', teks: 'bank mana?' },
    { dari: 'dia', teks: 'Bank... eh, bank kami. Demi keamanan, mohon sebutkan nomor kartu dan PIN Anda' },
    { dari: 'aku', teks: 'nggak bakal. petugas bank asli nggak pernah minta PIN' },
    { dari: 'dia', teks: 'Kalau tidak, rekening Anda hangus dalam 1 jam!' },
    { dari: 'aku', teks: 'ya udah, hangusin aja. saya telepon bank langsung' },
    { dari: 'info', teks: '(telepon diputus oleh penelepon)' }
  ],
  'Kak Karin': [
    { dari: 'dia', teks: 'Dek, kamu udah ngasih tau Mami belum soal itu?' },
    { dari: 'aku', teks: 'belum, Kak. nunggu waktu yang pas' },
    { dari: 'dia', teks: 'Mami sih udah curiga, katanya kamu sering senyum-senyum sendiri liat hp' },
    { dari: 'aku', teks: 'KAK' },
    { dari: 'dia', teks: 'hahaha. ya udah, kapan-kapan bawa pulang aja orangnya' },
    { dari: 'aku', teks: 'pelan-pelan dulu ya, Kak' },
    { dari: 'dia', teks: 'oke oke. semangat kuisnya!' }
  ],
  'dr. Aryo': [
    { dari: 'dia', teks: 'Jeno, saya lihat nilai praktikum kamu minggu lalu bagus' },
    { dari: 'aku', teks: 'terima kasih, dok' },
    { dari: 'dia', teks: 'Tapi kamu kelihatan capek. Tidur cukup itu bagian dari belajar kedokteran, lho' },
    { dari: 'aku', teks: 'iya dok, saya usahakan' },
    { dari: 'dia', teks: 'Untuk kuis Kamis, fokus ke fisiologi kardiovaskular. Sisanya santai saja' },
    { dari: 'aku', teks: 'baik dok, makasih banyak infonya' },
    { dari: 'dia', teks: 'Sama-sama. Istirahat ya' }
  ]
};

// Foto latar layar panggilan (nama file tanpa .jpg). Boleh dikosongin.
const fotoKontak = { 'Hyuck 💕': 'profilehc' };

// ====== KODE PANGGILAN ======
const call = document.getElementById('call');
const cstat = document.getElementById('cstat');
const cchat = document.getElementById('cchat');
let timers = [], tick = null, detik = 0;

function bersih() { timers.forEach(clearTimeout); timers = []; clearInterval(tick); }
function format(d) { return String(Math.floor(d / 60)).padStart(2, '0') + ':' + String(d % 60).padStart(2, '0'); }

function pasangBg(el, nama) {
  const coba = [nama + '.jpg', nama + '.jpg.jpg'];
  (function next(i) {
    if (i >= coba.length) return;
    const im = new Image();
    im.onload = () => { el.style.backgroundImage = "url('" + coba[i] + "')"; };
    im.onerror = () => next(i + 1);
    im.src = coba[i];
  })(0);
}

function tambah(o) {
  const b = document.createElement('div');
  b.className = 'b ' + o.dari;
  b.textContent = o.teks;
  cchat.appendChild(b);
  cchat.scrollTop = cchat.scrollHeight;
}

function tutup() { bersih(); call.style.display = 'none'; }

function selesai() {
  clearInterval(tick);
  cstat.textContent = 'Call Ended';
  timers.push(setTimeout(tutup, 1300));
}

function mulai(nama) {
  bersih();
  document.getElementById('cnama').textContent = nama;
  cchat.innerHTML = '';
  cstat.textContent = 'calling…';
  const cbg = document.getElementById('cbg');
  cbg.style.backgroundImage = 'none';
  if (fotoKontak[nama]) pasangBg(cbg, fotoKontak[nama]);
  document.querySelectorAll('.cb').forEach(b => b.classList.remove('on'));
  call.style.display = 'flex';

  const obrolan = percakapan[nama] || [{ dari: 'info', teks: 'Tidak ada yang mengangkat' }];
  let t = 1600;
  timers.push(setTimeout(() => {
    detik = 0;
    cstat.textContent = format(0);
    tick = setInterval(() => { detik++; cstat.textContent = format(detik); }, 1000);
  }, t));
  obrolan.forEach(o => {
    t += 1200 + o.teks.length * 38;
    timers.push(setTimeout(() => tambah(o), t));
  });
  t += 3000;
  timers.push(setTimeout(selesai, t));
}

document.getElementById('cend').onclick = tutup;
document.querySelectorAll('.cb').forEach(b => b.onclick = () => b.classList.toggle('on'));
</script>
</body>
</html>
