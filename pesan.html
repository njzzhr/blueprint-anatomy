<style>
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;background:#0b0b0f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.hp{position:relative;height:92vh;aspect-ratio:390/844;font-size:1.7vh;border:.8vh solid #222;border-radius:6vh;overflow:hidden;color:#fff;background:#000}
.pulau{position:absolute;top:1.4vh;left:50%;transform:translateX(-50%);width:13vh;height:4vh;background:#000;border-radius:3vh;z-index:60}
.status{position:absolute;top:1.4vh;left:0;right:0;height:4vh;display:flex;justify-content:space-between;align-items:center;padding:0 2.4em;font-weight:600;z-index:59}
.status .r{display:flex;align-items:center;gap:.4em}
.status svg{fill:#fff;height:.8em;width:auto}
.bt{width:1.9em;height:.95em;border:1px solid rgba(255,255,255,.55);border-radius:.3em;position:relative}
.bt::before{content:"";position:absolute;left:1px;top:1px;bottom:1px;width:75%;background:#fff;border-radius:.15em}

.pg{position:absolute;inset:0;display:none;flex-direction:column;padding-top:5.8vh;background:#000}
.pg.on{display:flex}
.ava{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;background-size:cover;background-position:center;flex:none}

.nav{display:flex;justify-content:space-between;align-items:center;padding:.7em 1.1em;color:#0a84ff;font-size:1em;min-height:2.6em}
.nav svg{width:1.4em;height:1.4em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sc{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding-bottom:3.4em}
.sc::-webkit-scrollbar{display:none}
.big{font-size:2em;font-weight:700;padding:.1em 1.1em .35em}
.cari{display:flex;align-items:center;gap:.5em;background:#1c1c1e;border-radius:.8em;margin:0 1.1em .8em;padding:.55em .8em}
.cari input{flex:1;background:none;border:0;outline:0;color:#fff;font-size:.95em;font-family:inherit}
.cari input::placeholder{color:#8e8e93}
.pinned{display:flex;gap:.5em;justify-content:space-around;padding:0 .8em .6em}
.pn{position:relative;width:5.6em;text-align:center;cursor:pointer}
.pn .ava{margin:0 auto .35em}
.pn b{display:block;font-size:.78em;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn .dot{position:absolute;top:-.2em;right:.2em;min-width:1.5em;height:1.5em;padding:0 .35em;border-radius:1em;background:#0a84ff;font-size:.72em;font-style:normal;font-weight:600;display:grid;place-items:center;border:.15em solid #000}
.cv{display:flex;gap:.8em;padding:.7em 1.1em;cursor:pointer;position:relative}
.cv + .cv::before,.pinned + .lst .cv:first-child::before{content:"";position:absolute;top:0;left:5.4em;right:0;height:1px;background:#1f1f21}
.cv .tx{flex:1;min-width:0}
.r1{display:flex;justify-content:space-between;align-items:baseline;gap:.5em}
.r1 b{font-size:1em;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r1 .w{color:#8e8e93;font-size:.78em;flex:none}
.r2{display:flex;justify-content:space-between;align-items:flex-start;gap:.6em;margin-top:.15em}
.pv{color:#8e8e93;font-size:.86em;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bd{flex:none;min-width:1.7em;height:1.7em;padding:0 .4em;border-radius:1em;background:#0a84ff;font-size:.75em;font-style:normal;font-weight:600;display:grid;place-items:center}
.bd.mt{background:#48484a}

.hd .bk svg{width:1.4em;height:1.4em;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hd .bk span{background:#0a84ff;color:#fff;font-size:.75em;font-weight:600;border-radius:1em;padding:.05em .55em}

.hd .ava{margin:0 auto .25em}

.ms{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding:.4em 1em 1em}
.ms::-webkit-scrollbar{display:none}
.sep{text-align:center;color:#8e8e93;font-size:.72em;margin:.9em 0 .4em}
.sep b{font-weight:600}
.sn{font-size:.7em;margin:.5em 0 .1em .9em}
.m{max-width:74%;padding:.55em .9em;border-radius:1.2em;font-size:.98em;margin:.15em 0;line-height:1.3;width:fit-content;word-wrap:break-word;animation:muncul .2s}
.m.in{background:#262629}
.m.out{background:#0a84ff;margin-left:auto}
.dlv{text-align:right;color:#8e8e93;font-size:.68em;margin:.1em .4em}
@keyframes muncul{from{opacity:0;transform:translateY(.5em)}to{opacity:1;transform:none}}
.inp{display:flex;align-items:center;gap:.6em;padding:.5em .8em 2.6em;flex:none}
.inp .pl{width:2.2em;height:2.2em;border-radius:50%;background:#2c2c2e;display:grid;place-items:center;font-size:1.2em;color:#aaa;flex:none}

.inp input{flex:1;background:none;border:0;outline:0;color:#fff;font-size:.95em;font-family:inherit;min-width:0}
.inp input::placeholder{color:#6e6e73}
.kirim{width:1.9em;height:1.9em;border-radius:50%;background:#0a84ff;display:none;place-items:center;cursor:pointer;flex:none}
.kirim.on{display:grid}
.kirim svg{width:1em;height:1em;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.rep{padding:.8em 1em 2.8em;text-align:center;font-size:.8em;color:#8e8e93;background:#161618;flex:none}
.rep b{display:block;color:#0a84ff;font-size:1.15em;margin-top:.3em}

/* ===== BANNER NOTIFIKASI ===== */
.ban{position:absolute;top:-9em;left:.6em;right:.6em;background:rgba(52,52,56,.97);border-radius:1.6em;padding:.7em .9em;display:flex;gap:.8em;align-items:center;z-index:70;transition:top .35s;box-shadow:0 .3em 1.2em rgba(0,0,0,.6);cursor:pointer}
.ban.on{top:5.4em}
.ban .bi{width:2.6em;height:2.6em;border-radius:.65em;background:linear-gradient(#67f27f,#17c33a);display:grid;place-items:center;flex:none}
.ban .bi svg{width:1.6em;height:1.6em;fill:#fff}
.ban .bb{flex:1;min-width:0}
.ban .bb b{display:block;font-size:.9em;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ban .bb span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.85em;color:#d0d0d4;line-height:1.3}
.ban small{color:#8e8e93;font-size:.72em;align-self:flex-start;flex:none}

.home{position:absolute;bottom:0;left:0;right:0;height:2.2em;display:flex;justify-content:center;align-items:flex-end;padding-bottom:.6em;cursor:pointer;z-index:65}

function pasang(el, nama) {
  const coba = [nama + '.jpg', nama + '.jpg.jpg'];
  (function next(i) {
    if (i >= coba.length) return;
    const im = new Image();
    im.onload = () => { el.style.backgroundImage = "url('" + coba[i] + "')"; el.innerHTML = ''; };
    im.onerror = () => next(i + 1);
    im.src = coba[i];

}
function fotoAvatar() { document.querySelectorAll('[data-foto]').forEach(e => { if (e.dataset.foto) pasang(e, e.dataset.foto); }); }

function av(k, s) {
  const c = K[k];

function simpanTotal() { try { localStorage.setItem('pesanUnread', String(total())); } catch (e) {} }
function terakhir(k) { const p = T[k].pesan; return p[p.length - 1]; }
function waktuTampil(m) { return m.h === 'Today' ? m.w : m.h; }
function preview(k) {
  const m = terakhir(k);
  if (T[k].grup && m.d !== 'aku') return K[m.d].n.split(' ')[0] + ': ' + m.t;
  return m.t;
}

// ---------- BERANDA ----------
function renderInbox() {
  const q = $('q').value.trim().toLowerCase();
  $('pinned').innerHTML = q ? '' : pinned.map(k =>
    '<div class="pn" data-th="' + k + '">' + av(k, 4.6) + (T[k].belum ? '<i class="dot">' + T[k].belum + '</i>' : '') + '<b>' + esc(K[k].n) + '</b></div>'
  ).join('');
  const keys = (q ? pinned.concat(urut) : urut).filter(k => !q || (K[k].n + ' ' + preview(k)).toLowerCase().includes(q));
  $('lst').innerHTML = keys.map(k => {
    const m = terakhir(k), t = T[k];
    return '<div class="cv" data-th="' + k + '">' + av(k, 3.3) +
      '<div class="tx"><div class="r1"><b>' + esc(K[k].n) + (t.muted ? ' 🔕' : '') + '</b><span class="w">' + esc(waktuTampil(m)) + '</span></div>' +
      '<div class="r2"><span class="pv">' + esc(preview(k)) + '</span>' + (t.belum ? '<i class="bd' + (t.muted ? ' mt' : '') + '">' + t.belum + '</i>' : '') + '</div></div></div>';
  }).join('');
  fotoAvatar();
}

// ---------- PERCAKAPAN ----------
function renderThread() {
  const t = T[aktif], c = K[aktif];
  const sisa = total() - t.belum;
  $('hd').innerHTML =
    '<div class="bk" id="bk"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>' + (sisa ? '<span>' + sisa + '</span>' : '') + '</div>' +
    (c.layanan ? '' : '<div class="ik2"><svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg><svg viewBox="0 0 24 24"><rect x="2" y="6" width="13" height="12" rx="3"/><path d="M15 10l7-3v10l-7-3z"/></svg></div>') +
    av(aktif, 3.4) + '<b>' + esc(c.n) + (c.layanan ? '' : ' ›') + '</b>' + (t.grup ? '<small>' + esc(t.anggota) + '</small>' : '');

  let h = '', prevH = null, prevD = null;
  t.pesan.forEach(m => {
    if (m.h !== prevH) { h += '<div class="sep"><b>' + esc(m.h) + '</b> ' + esc(m.w) + '</div>'; prevH = m.h; prevD = null; }
    const out = m.d === 'aku';
    if (t.grup && !out && m.d !== prevD) h += '<div class="sn" style="color:' + K[m.d].w[0] + '">' + esc(K[m.d].n) + '</div>';
    h += '<div class="m ' + (out ? 'out' : 'in') + '">' + esc(m.t) + '</div>';
    prevD = m.d;
  });
  if (terakhir(aktif).d === 'aku') h += '<div class="dlv">Delivered</div>';
  $('ms').innerHTML = h;
  $('ms').scrollTop = $('ms').scrollHeight;

  $('inpBar').style.display = (c.layanan ? 'none' : 'flex');
  $('rep').style.display = (c.spam ? 'block' : 'none');
  fotoAvatar();
}

function buka(k) {
  aktif = k;
  T[k].belum = 0;
  simpanTotal();
  renderThread();
  $('inbox').classList.remove('on'); $('thread').classList.add('on');
  $('ban').classList.remove('on');
}
function tutup() {
  aktif = null;
  $('thread').classList.remove('on'); $('inbox').classList.add('on');
  renderInbox();
}

// ---------- PESAN MASUK + NOTIFIKASI ----------
function banner(th, dari, teks) {
  const pengirim = (T[th].grup && dari !== 'aku') ? K[dari].n + ' · ' + K[th].n : K[th].n;
  const ban = $('ban');
  ban.innerHTML = '<div class="bi"><svg viewBox="0 0 24 24"><path d="M12 4C6.5 4 2.5 7.4 2.5 11.6c0 2.4 1.3 4.5 3.4 5.9-.3 1.3-1 2.4-1.9 3.3 1.8-.1 3.4-.8 4.7-1.8.9.2 1.8.3 2.8.3 5.5 0 9.5-3.4 9.5-7.7S17.5 4 12 4z"/></svg></div>' +
    '<div class="bb"><b>' + esc(pengirim) + '</b><span>' + esc(teks) + '</span></div><small>now</small>';
  ban.dataset.th = th;
  ban.classList.add('on');
  clearTimeout(bantimer);
  bantimer = setTimeout(() => ban.classList.remove('on'), 4800);
}

function pesanMasuk(th, dari, teks) {
  T[th].pesan.push({ d: dari, t: teks, w: '21:07', h: 'Today' });
  const terbuka = (aktif === th);
  if (terbuka) { renderThread(); }
  else {
    T[th].belum++;
    if (!T[th].muted) banner(th, dari, teks);
  }
  if (urut.includes(th)) { urut = [th].concat(urut.filter(x => x !== th)); }
  simpanTotal();
  if (!aktif) renderInbox();
}

$('ban').onclick = () => { const th = $('ban').dataset.th; if (th) buka(th); };

// ---------- KIRIM ----------
function kirim() {
  const v = $('inp').value.trim();
  if (!v || !aktif) return;
  const th = aktif;
  T[th].pesan.push({ d: 'aku', t: v, w: '21:07', h: 'Today' });
  $('inp').value = ''; $('kirim').classList.remove('on');
  renderThread();
  const b = balasan[th];
  if (b) {
    idxBalas[th] = (idxBalas[th] || 0);
    const teks = b[idxBalas[th] % b.length]; idxBalas[th]++;
    setTimeout(() => pesanMasuk(th, th, teks), 1800);
  }
}
$('inp').addEventListener('input', () => $('kirim').classList.toggle('on', $('inp').value.trim().length > 0));
$('inp').addEventListener('keydown', e => { if (e.key === 'Enter') kirim(); });
$('kirim').onclick = kirim;

// ---------- EVENT ----------
document.addEventListener('click', e => {
  const th = e.target.closest('[data-th]');
  if (th && $('inbox').classList.contains('on')) { buka(th.dataset.th); return; }
  if (e.target.closest('#bk')) tutup();
});
$('q').oninput = renderInbox;

// ---------- JALAN ----------
simpanTotal();
renderInbox();
if (NOTIF_JALAN) masuk.forEach(p => setTimeout(() => pesanMasuk(p.th, p.d, p.t), p.ms));
</script>
</body>
</html>
