<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Calendar</title>
<style>
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;background:#0b0b0f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.hp{position:relative;height:92vh;aspect-ratio:390/844;font-size:1.7vh;border:.8vh solid #222;border-radius:6vh;overflow:hidden;color:#fff;background:#000}
.pulau{position:absolute;top:1.4vh;left:50%;transform:translateX(-50%);width:13vh;height:4vh;background:#000;border-radius:3vh;z-index:12}
.status{position:absolute;top:1.4vh;left:0;right:0;height:4vh;display:flex;justify-content:space-between;align-items:center;padding:0 2.4em;font-weight:600;z-index:11}
.status .r{display:flex;align-items:center;gap:.4em}
.status svg{fill:#fff;height:.8em;width:auto}
.bt{width:1.9em;height:.95em;border:1px solid rgba(255,255,255,.55);border-radius:.3em;position:relative}
.bt::before{content:"";position:absolute;left:1px;top:1px;bottom:1px;width:75%;background:#fff;border-radius:.15em}

.page{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:5.8vh;background:#000}
.nav{display:flex;justify-content:space-between;align-items:center;padding:.7em 1.1em;color:#ff453a;font-size:1em}
.nav span{cursor:pointer;display:flex;align-items:center;gap:.15em}
svg.s{width:1.4em;height:1.4em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.judul{display:flex;justify-content:space-between;align-items:baseline;padding:.1em 1.1em .5em}
.judul b{font-size:2em;font-weight:700}
.judul b small{font-size:.5em;font-weight:500;color:#ff453a;margin-left:.3em}
.judul .pan{display:flex;gap:1.2em;color:#ff453a}
.judul .pan svg{cursor:pointer;width:1.6em;height:1.6em}
.hr{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;color:#8e8e93;font-size:.75em;font-weight:600;padding:0 .6em .4em;border-bottom:1px solid #1f1f21}
#grid{display:grid;grid-template-columns:repeat(7,1fr);padding:.3em .6em;gap:.1em 0;border-bottom:1px solid #1f1f21}
.d{height:3.4em;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;cursor:pointer;padding-top:.25em}
.d .n{width:2em;height:2em;border-radius:50%;display:grid;place-items:center;font-size:1.05em}
.d.lain .n{color:#4b4b4f}
.d.ini .n{background:#ff3b30;color:#fff;font-weight:600}
.d.pil:not(.ini) .n{background:#3a3a3c}
.d.pil.ini .n{box-shadow:0 0 0 .15em #5a1a17}
.d .t{display:flex;gap:.2em;height:.5em;margin-top:.2em}
.d .t i{width:.4em;height:.4em;border-radius:50%;display:block}
.acara{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding:.7em 1.1em}
.acara::-webkit-scrollbar{display:none}
.tgl{color:#8e8e93;font-size:.8em;font-weight:600;margin-bottom:.6em}
.ev{display:flex;gap:.8em;padding:.5em 0;align-items:stretch}
.ev .w{width:3.4em;color:#8e8e93;font-size:.8em;text-align:right;padding-top:.15em}
.ev .bar{width:.3em;border-radius:1em;flex:none}
.ev .i b{display:block;font-size:.98em;font-weight:500}
.ev .i small{display:block;color:#8e8e93;font-size:.8em;margin-top:.15em}
.kosong{color:#8e8e93;text-align:center;padding:2.2em 0;font-size:.95em}
.foot{display:flex;justify-content:space-between;padding:.8em 1.4em 2.8em;background:#1c1c1e;color:#ff453a;font-size:.95em}
.foot span{cursor:pointer}
.foot .tengah{color:#fff}
.home{position:absolute;bottom:0;left:0;right:0;height:2.2em;display:flex;justify-content:center;align-items:flex-end;padding-bottom:.6em;cursor:pointer;z-index:13}
.home i{width:10em;height:.35em;border-radius:1em;background:#fff;display:block}
</style>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="stylesheet" href="mobile.css"></head>
<body>
<div class="hp">
  <div class="pulau"></div>

  <div class="status">
    <span>21:06</span>
    <div class="r">
      <svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx=".7"/><rect x="5" y="5.5" width="3" height="6.5" rx=".7"/><rect x="10" y="3" width="3" height="9" rx=".7"/><rect x="15" y="0" width="3" height="12" rx=".7"/></svg>
      <svg viewBox="0 0 16 12"><path d="M8 2.4c2.2 0 4.2.9 5.7 2.3l1-1.1C12.9 1.9 10.6.9 8 .9S3.1 1.9 1.3 3.6l1 1.1C3.8 3.3 5.8 2.4 8 2.4zm0 3.6c1.2 0 2.3.5 3.2 1.2l1-1.1C11 5 9.6 4.4 8 4.4S5 5 3.8 6.1l1 1.1C5.7 6.5 6.8 6 8 6zm0 3.4L6.3 7.6c.5-.5 1.1-.7 1.7-.7s1.2.2 1.7.7L8 9.4z"/></svg>
      <div class="bt"></div>
    </div>
  </div>

  <div class="page">
    <div class="nav">
      <span onclick="location.href='home.html'"><svg class="s" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><b id="thn" style="font-weight:500">2026</b></span>
      <svg class="s" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </div>
    <div class="judul">
      <b id="bln">Oktober</b>
      <div class="pan">
        <svg class="s" id="prev" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
        <svg class="s" id="next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
      </div>
    </div>
    <div class="hr"><div>S</div><div>S</div><div>R</div><div>K</div><div>J</div><div>S</div><div>M</div></div>
    <div id="grid"></div>
    <div class="acara" id="acara"></div>
    <div class="foot"><span id="hariini">Today</span><span class="tengah">Calendars</span><span>Inbox</span></div>
  </div>

  <div class="home" onclick="location.href='home.html'"><i></i></div>
</div>

<script>
// ====== GANTI / TAMBAH ACARA DI SINI ======
// tgl   = 'TAHUN-BULAN-TANGGAL' (contoh: '2026-10-24')
// jam   = jam acara (kosongin '' kalau seharian)
// judul = nama acara,  sub = keterangan kecil (boleh kosong)
// warna = warna garis dan titik
const MERAH = '#ff453a', BIRU = '#0a84ff', HIJAU = '#30d158', UNGU = '#bf5af2', ORANYE = '#ff9f0a';
const acara = [
  { tgl: '2026-10-22', jam: '14:00', judul: 'Nunggu Hyuck di perpus', sub: 'sampai 17:00 (3 jam!)', warna: ORANYE },
  { tgl: '2026-10-24', jam: '20:00', judul: 'Makan es krim sama Hyuck 💕', sub: 'dia yang jemput', warna: MERAH },
  { tgl: '2026-10-26', jam: '07:30', judul: 'Praktikum anatomi', sub: 'Lab Anatomi', warna: BIRU },
  { tgl: '2026-10-27', jam: '09:00', judul: 'Kuliah biokimia', sub: '', warna: BIRU },
  { tgl: '2026-10-28', jam: '10:00', judul: 'Tutorial blok', sub: 'jangan telat lagi', warna: BIRU },
  { tgl: '2026-10-29', jam: '08:00', judul: 'Kuis fisiologi', sub: 'fokus kardiovaskular', warna: UNGU },
  { tgl: '2026-10-30', jam: '',      judul: 'Kosong, jalan sama Hyuck 💕', sub: '', warna: MERAH },
  { tgl: '2026-10-31', jam: '23:59', judul: 'Deadline tugas gambar Hyuck', sub: 'temenin begadang', warna: ORANYE },
  { tgl: '2026-11-07', jam: '12:00', judul: 'Pulang ke rumah Mami', sub: 'katanya masak rendang', warna: HIJAU }
];

// Tanggal "hari ini" di cerita kamu (bulan mulai dari 0: Januari=0, Oktober=9)
const HARI_INI = new Date(2026, 9, 24);

// ====== KODE ======
const NAMA_BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const NAMA_HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];

function kunci(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
let tahun = HARI_INI.getFullYear(), bulan = HARI_INI.getMonth(), pilih = kunci(HARI_INI);

const grid = document.getElementById('grid');
const daftar = document.getElementById('acara');

function render() {
  document.getElementById('bln').innerHTML = NAMA_BULAN[bulan];
  document.getElementById('thn').textContent = tahun;

  const awal = new Date(tahun, bulan, 1);
  const geser = (awal.getDay() + 6) % 7;                 // minggu mulai hari Senin
  const jumlah = new Date(tahun, bulan + 1, 0).getDate();
  const baris = Math.ceil((geser + jumlah) / 7);
  grid.innerHTML = '';

  for (let i = 0; i < baris * 7; i++) {
    const d = new Date(tahun, bulan, 1 - geser + i);
    const k = kunci(d);
    const sel = document.createElement('div');
    sel.className = 'd' + (d.getMonth() !== bulan ? ' lain' : '') + (k === kunci(HARI_INI) ? ' ini' : '') + (k === pilih ? ' pil' : '');
    sel.innerHTML = '<div class="n"></div><div class="t"></div>';
    sel.querySelector('.n').textContent = d.getDate();
    const warna = [...new Set(acara.filter(a => a.tgl === k).map(a => a.warna))].slice(0, 3);
    warna.forEach(w => { const t = document.createElement('i'); t.style.background = w; sel.querySelector('.t').appendChild(t); });
    sel.onclick = () => {
      pilih = k;
      if (d.getMonth() !== bulan) { bulan = d.getMonth(); tahun = d.getFullYear(); }
      render();
    };
    grid.appendChild(sel);
  }
  renderAcara();
}

function renderAcara() {
  const [y, m, t] = pilih.split('-').map(Number);
  const tgl = new Date(y, m - 1, t);
  daftar.innerHTML = '';
  const judul = document.createElement('div');
  judul.className = 'tgl';
  judul.textContent = NAMA_HARI[tgl.getDay()] + ', ' + t + ' ' + NAMA_BULAN[m - 1] + ' ' + y;
  daftar.appendChild(judul);

  const hari = acara.filter(a => a.tgl === pilih).sort((a, b) => (a.jam || '00:00').localeCompare(b.jam || '00:00'));
  if (!hari.length) {
    const k = document.createElement('div'); k.className = 'kosong'; k.textContent = 'No Events';
    daftar.appendChild(k); return;
  }
  hari.forEach(a => {
    const e = document.createElement('div');
    e.className = 'ev';
    e.innerHTML = '<div class="w"></div><div class="bar"></div><div class="i"><b></b><small></small></div>';
    e.querySelector('.w').textContent = a.jam || 'seharian';
    e.querySelector('.bar').style.background = a.warna;
    e.querySelector('b').textContent = a.judul;
    const s = e.querySelector('small');
    if (a.sub) s.textContent = a.sub; else s.remove();
    daftar.appendChild(e);
  });
}

document.getElementById('prev').onclick = () => { bulan--; if (bulan < 0) { bulan = 11; tahun--; } render(); };
document.getElementById('next').onclick = () => { bulan++; if (bulan > 11) { bulan = 0; tahun++; } render(); };
document.getElementById('hariini').onclick = () => {
  tahun = HARI_INI.getFullYear(); bulan = HARI_INI.getMonth(); pilih = kunci(HARI_INI); render();
};
render();
</script>
</body>
</html>
